<html lang="en">

<head>
  <meta charset="utf-8">
  <title>FoodConnect • Orphanage Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="/foodconnect-logo.png">
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="logo">FoodConnect</div>
      <div class="nav">
        <span class="badge" id="profileBadge">Loading...</span>
        <button class="btn small brown" id="editProfileBtn">Edit Profile</button>
        <button class="btn small" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="grid grid-2">
      <!-- Left: Post/Update need -->
      <section class="card">
        <div class="row" style="justify-content:space-between">
          <h2 style="margin:0">Request Food</h2>
          <span class="tag">Orphanage</span>
        </div>

        <div class="kpis">
          <div class="kpi">
            <h3 id="statRequests">0</h3>
            <p>Requests posted</p>
          </div>
          <div class="kpi">
            <h3 id="statAccepted">0</h3>
            <p>Accepted</p>
          </div>
          <div class="kpi">
            <h3 id="statVerified">0</h3>
            <p>Verified</p>
          </div>
        </div>

        <hr class="sep">

        <div class="grid grid-2">
          <div><label>Needs</label><input id="oneeds" class="input" placeholder="e.g., Dinner for 40"></div>
          <div><label>Description</label><input id="odesc" class="input" placeholder="e.g., Vegetarian"></div>
          <div><label>Address</label><input id="oaddr" class="input" placeholder="Full address"></div>
          <div><label>Latitude</label><input id="olat" class="input" placeholder="e.g., 17.385044"></div>
          <div><label>Longitude</label><input id="olng" class="input" placeholder="e.g., 78.486671"></div>
          <div><label>Contact Email</label><input id="ocontact" class="input" placeholder="contact@email.com"></div>
        </div>

        <div style="margin-top:10px;display:flex;gap:10px">
          <button class="btn primary" id="postRequest">Post/Update Need</button>
          <span id="formMsg" class="helper"></span>
        </div>

        <p class="helper" style="margin-top:10px"><b>Tip:</b> Verified posts are highlighted so donors can find you
          faster.</p>
      </section>

      <!-- Right: Donors with extra food -->
      <section class="card">
        <h2>Donors with extra food</h2>

        <div class="filters">
          <input id="flocation" class="input" placeholder="Filter donors by area (e.g., Madhapur)">
          <select id="ftime" class="input">
            <option value="all">All time</option>
            <option value="day">Last 24 hours</option>
            <option value="week">Last week</option>
            <option value="month">Last month</option>
          </select>
          <select id="fverified" class="input">
            <option value="any">Any status</option>
            <option value="verified">Verified only</option>
            <option value="unverified">Unverified only</option>
          </select>
        </div>

        <div id="list" style="margin-top:15px"></div>
      </section>
    </div>

    <!-- Inbox section -->
    <section class="card" style="margin-top:20px">
      <h2>Inbox</h2>
      <p class="helper">Offers and volunteer messages sent to you appear here.</p>
      <div id="inboxList" style="margin-top:10px"></div>
    </section>
  </div>

  <!-- Edit Profile Modal -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <h2>Edit Profile</h2>
      <div id="editFields"></div>
      <div style="margin-top:15px;display:flex;gap:10px">
        <button class="btn primary" id="saveProfileBtn">Save</button>
        <button class="btn" id="cancelEditBtn">Cancel</button>
      </div>
      <p id="editMsg" class="helper" style="margin-top:10px"></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="firebase.js"></script>
  <script src="utils.js"></script>
  <script src="app.js"></script>
  <script src="orphanage.js"></script>
</body>

</html><!doctype html>
